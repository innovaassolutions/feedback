name: CI

on:
  push:
  pull_request:

jobs:
  agent-eval-gate:
    name: Eval report for every changed AGENT.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git fetch origin main
      - run: npx tsx scripts/check-eval-reports.ts --base origin/main

  check:
    name: Type check, lint and Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm run check
